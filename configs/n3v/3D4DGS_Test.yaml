gaussian_dim: 4
time_duration: [0.0, 7]
num_pts: 20_0000
num_pts_ratio: 1.0
rot_4d: True
force_sh_3d: True
batch_size: 4
exhaust_test: False
start_checkpoint: "output/3d4dgs/miku_shaungxue_daxi/test_short/chkpnt_15000.pth"

ModelParams:
  sh_degree: 3
  source_path: "./datasets/miku_shaungxue_daxi/test_short"
  model_path: "output/3d4dgs/miku_shaungxue_daxi/test_short"
  images: "images"
  resolution: 1 
  white_background: False
  data_device: "cuda"
  eval: True
  extension: ".png"
  num_extra_pts: 0
  loaded_pth: ""
  frame_ratio: 1
  dataloader: True
  # [核心路由] 指定使用的模型类型
  model_type: "baseline_4dgs"   # 可选值: baseline_4dgs, swings, hybrid_gs

PipelineParams:
  convert_SHs_python: False
  compute_cov3D_python: False
  debug: False
  env_map_res: 0 
  env_optimize_until: 5000000000
  env_optimize_from: 0
  eval_shfs_4d: True

OptimizationParams:
  iterations: 15000
  position_lr_init: 0.00016
  position_t_lr_init: -1.0
  position_lr_final: 0.0000016
  position_lr_delay_mult: 0.01
  position_lr_max_steps: 15000
  feature_lr: 0.0025
  opacity_lr: 0.05
  scaling_lr: 0.005
  rotation_lr: 0.001
  percent_dense: 0.01
  lambda_dssim: 0.2
  thresh_opa_prune: 0.005
  densification_interval: 100 
  opacity_reset_interval: 3000
  densify_from_iter: 500 
  densify_until_iter: 10000
  densify_grad_threshold: 0.0002
  densify_grad_t_threshold: 0.000005  # [修复] 必须是直接的浮点数，不能写除法表达式
  densify_until_num_points: 2000000
  final_prune_from_iter: -1
  sh_increase_interval: 1000
  lambda_opa_mask: 0.0
  lambda_rigid: 0.0
  lambda_motion: 0.0