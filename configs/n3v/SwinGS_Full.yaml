gaussian_dim: 4
time_duration: [0.0, 100]
num_pts: 20_0000
num_pts_ratio: 1.0
rot_4d: True
force_sh_3d: True
batch_size: 4
exhaust_test: False
# start_checkpoint: "output/swings/miku_shaungxue_daxi/full/chkpnt_10000.pth"

ModelParams:
  sh_degree: 3
  # source_path: "./datasets/miku_shaungxue_daxi/full"
  # model_path: "output/swings/miku_shaungxue_daxi/full"
  images: "images"
  resolution: 1 
  white_background: False
  data_device: "cuda"
  eval: True
  extension: ".png"
  num_extra_pts: 0
  loaded_pth: ""
  frame_ratio: 1
  dataloader: True
  # [核心路由] 指定使用的模型类型
  model_type: "swings"   # 可选值: baseline_4dgs, swings, hybrid_gs

PipelineParams:
  convert_SHs_python: False
  compute_cov3D_python: False
  debug: False
  env_map_res: 0 
  env_optimize_until: 5000000000
  env_optimize_from: 0
  eval_shfs_4d: True

OptimizationParams:
  iterations: 10000
  position_lr_init: 0.00016
  position_t_lr_init: -1.0
  position_lr_final: 0.0000016
  position_lr_delay_mult: 0.01
  position_lr_max_steps: 30000
  feature_lr: 0.0025
  opacity_lr: 0.05
  scaling_lr: 0.005
  rotation_lr: 0.001
  percent_dense: 0.01
  lambda_dssim: 0.2
  thresh_opa_prune: 0.005
  densification_interval: 100 
  opacity_reset_interval: 3000
  densify_from_iter: 500 
  densify_until_iter: 8000
  densify_grad_threshold: 0.00016
  densify_grad_t_threshold: 0.000005  # [修复] 必须是直接的浮点数，不能写除法表达式
  densify_until_num_points: 2200000
  final_prune_from_iter: -1
  sh_increase_interval: 1000
  lambda_opa_mask: 0.0
  lambda_rigid: 0.0
  lambda_motion: 0.0
  
  # ==========================================================
  # [新增] SWinGS 与 HybridGS 专属超参数
  # ==========================================================
  swin_size: 72             # SWinGS 滑动窗口大小 (基于显存和视频长度调整)
  lambda_time: 0.00003       # SWinGS: 时间一致性正则化惩罚系数
  replay_prob: 0.65        # SWinGS / HybridGS 经验回放概率
  warmup_iterations: 2000        # SWinGS Warmup 阶段开始迭代比例
  finetune_iterations: 2000   # SWinGS 细调阶段迭代比例 (在 Warmup 之后，全面开启时间一致性正则化)
  densify_until_iter_after_freeze: 500  # SWinGS / HybridGS 冻结后继续增密的迭代次数
  densify_grad_threshold_after_freeze: 0.0002  # SWinGS / HybridGS 冻结后增密的梯度阈值 (更严格)
  thresh_opa_prune_after_freeze: 0.006  # SWinGS / HybridGS 冻结后不确定点的透明度剪枝阈值 (更严格)
  iterations_after_freeze: 6500  # SWinGS / HybridGS 冻结后总迭代次数 (包含增密迭代)
  enable_split_after_freeze: True  # SWinGS / HybridGS 冻结后是否启用分割 (进一步提升细节表现)
  freeze_end_idx: 1         # 结束窗口号,包含该窗口,从0开始计数
  densify_until_num_points_after_freeze: 2800000 # 冻结后增密的最大点数 (更严格)
  densify_from_iter_after_freeze: 100  # 冻结后增密的起始迭代次数 (更早开始增密，提升细节表现)
  win_end_prune_opacity_threshold: 0.01 # SWinGS 滑动窗口结束时的透明度剪枝阈值 (更严格)
