gaussian_dim: 4
time_duration: [0.0, 6.666666666666667]
num_pts: 10_0000
num_pts_ratio: 1.0
rot_4d: True
force_sh_3d: True
batch_size: 4
exhaust_test: False
start_checkpoint: "output/hybrid_gs/miku_shaungxue_daxi/test_short/chkpnt_20000.pth" # 2901*20 迭代25w,增值25w，80滑动窗口，最多400w点

ModelParams:
  sh_degree: 3
  source_path: "./datasets/miku_shaungxue_daxi/test_short"
  model_path: "output/hybrid_gs/miku_shaungxue_daxi/test_short"
  images: "images"
  resolution: 1 
  white_background: False
  data_device: "cuda"
  eval: True
  extension: ".png"
  num_extra_pts: 0
  loaded_pth: ""
  frame_ratio: 1
  dataloader: True
  # [核心路由] 指定使用的模型类型
  model_type: "hybrid_gs"   # 可选值: baseline_4dgs, swings, hybrid_gs

PipelineParams:
  convert_SHs_python: False
  compute_cov3D_python: False
  debug: False
  env_map_res: 0 
  env_optimize_until: 5000000000
  env_optimize_from: 0
  eval_shfs_4d: True

OptimizationParams:
  iterations: 20000
  position_lr_init: 0.00016
  position_t_lr_init: -1.0
  position_lr_final: 0.0000016
  position_lr_delay_mult: 0.01
  position_lr_max_steps: 20000
  feature_lr: 0.0025
  opacity_lr: 0.05
  scaling_lr: 0.005
  rotation_lr: 0.001
  percent_dense: 0.01
  lambda_dssim: 0.2
  thresh_opa_prune: 0.005
  densification_interval: 100 
  opacity_reset_interval: 7000000
  densify_from_iter: 500 
  densify_until_iter: 10000
  densify_grad_threshold: 0.0002
  densify_grad_t_threshold: 0.000005  # [修复] 必须是直接的浮点数，不能写除法表达式
  densify_until_num_points: 2000000
  final_prune_from_iter: -1
  sh_increase_interval: 1000
  lambda_opa_mask: 0.0
  lambda_rigid: 0.0
  lambda_motion: 0.0
  
  # ==========================================================
  # [新增] SWinGS 与 HybridGS 专属超参数
  # ==========================================================
  swin_size: 50             # SWinGS 滑动窗口大小 (基于显存和视频长度调整)
  tau_avg: 0.0002             # HybridGS 硬约束：平均位移阈值
  tau_max: 0.001            # HybridGS 硬约束：最大瞬时位移阈值
  freeze_start: 0.2       # HybridGS 硬约束：冻结静态背景开始迭代比例
  freeze_end: 0.5         # HybridGS 硬约束：冻结静态背景结束迭代比例
  lambda_d: 0.1             # HybridGS 软约束：位移收敛正则化系数
  warmup_start: 0.10      # HybridGS 软约束：位移正则化开始迭代比例
  warmup_end: 0.25        # HybridGS 软约束：位移正则化结束迭代比例
  # ==========================================================
  # [毕设专属] 消融实验控制开关 (Ablation Switches)
  # ==========================================================
  use_soft_constraint: True   # 是否开启软约束 (运动速度惩罚)
  use_hard_constraint: True   # 是否开启硬约束 (静态背景冻结)

DebugParmas:
  save_ply_interval: 4000
  del_ply_on_start: True
  is_load_ply: True
  load_ply_path: "/home/ssh555/BiShe/Code/Hybrid-GS/output/hybrid_gs/miku_shaungxue_daxi/test_short/debug_point_cloud_4000.ply"